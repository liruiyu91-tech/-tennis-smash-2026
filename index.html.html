<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07131a"><title>Tennis Smash 2026 V4.1</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061017;color:white;font-family:-apple-system,BlinkMacSystemFont,Arial;touch-action:none}#c{position:fixed;inset:0;width:100%;height:100%;z-index:0}#hud{position:fixed;inset:0;z-index:2;pointer-events:none;text-shadow:0 2px 5px #000}#score{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:28px;font-weight:900}#sub,#msg{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap}#sub{top:47px;font-size:12px}#msg{top:68px;font-size:14px;font-weight:800}#stats{position:absolute;left:10px;top:10px;width:190px;font-size:11px}.bar{height:8px;background:#0009;border:1px solid #fff4;border-radius:8px;margin-bottom:5px}.bar i{display:block;height:100%;width:100%}.e{background:#fff}.s{background:#9bc9ff}#shots{position:absolute;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(4,72px);gap:6px;pointer-events:auto}button{color:#fff;background:#07161de8;border:1px solid #fff5;border-radius:12px;min-height:40px;font-weight:800}#shots .on{background:#fff;color:#061017}#skills{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;pointer-events:auto}#skills button{min-width:78px}.panel{position:fixed;inset:0;z-index:5;background:#000b;display:flex;align-items:center;justify-content:center}.card{width:min(88vw,480px);padding:25px;background:#10262ff7;border:1px solid #fff3;border-radius:24px;text-align:center}.card h1{margin:0 0 10px}.row{display:flex;gap:8px;margin:9px 0}.card button{flex:1;padding:12px}.primary{background:#fff;color:#061017}.hide{display:none!important}#rotate{display:none;position:fixed;z-index:20;inset:0;background:#061017;align-items:center;justify-content:center;text-align:center;font-size:21px;font-weight:900}@media(orientation:portrait){#rotate{display:flex}}
</style></head><body><canvas id="c"></canvas><div id="rotate">🎾 请横屏<br><small>横屏后进入游戏</small></div>
<div id="hud"><div id="score">0 - 0</div><div id="sub">第一盘 · 普通局</div><div id="msg">准备发球</div><div id="stats"><div class="bar"><i class="e" id="eb"></i></div><div class="bar"><i class="s" id="sb"></i></div>⚡ <b id="ep">0</b>/100　🔥连击 <b id="co">0</b></div><div id="skills"><button data-k="fire">🔥爆发</button><button data-k="slow">❄️减速</button><button data-k="zone">🎯Zone</button></div><div id="shots"><button data-s="flat">平击</button><button data-s="topspin" class="on">上旋</button><button data-s="slice">切削</button><button data-s="lob">高吊</button><button data-s="drop">放小球</button><button data-s="volley">截击</button><button data-s="smash">扣杀</button><button data-s="serve">发球</button></div></div>
<div id="menu" class="panel"><div class="card"><h1>🎾 Tennis Smash 2026 V4.1</h1><div class="row"><button id="start" class="primary">快速比赛</button><button id="train">训练场</button></div><div class="row"><button id="normal">AI普通</button><button id="hard">AI困难</button><button id="pro">AI Pro</button></div><p>触摸球场移动；球到你这一侧时，在球附近松手击球。6-6进入抢七，先到7且领先2分。</p></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W=0,H=0,d=1,last=0,run=false,training=false,ai='normal',press=false,charge=0,shot='topspin',skill='',slow=0,zone=0;
let P={x:.5,tx:.5,st:100,ep:0},A={x:.5,tx:.5},B={x:.5,y:.5,z:.04,vx:0,vy:0,vz:0,owner:'ai',active:false},pt=[0,0],game=[0,0],set=[0,0],tb=false,tbp=[0,0],combo=0,rally=0;
function resize(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function ui(){let s;if(training)s='训练 · '+rally+' 回合';else if(tb)s='抢七 '+tbp[0]+' - '+tbp[1];else{let f=n=>['0','15','30','40'][Math.min(n,3)];s=pt[0]>=3&&pt[1]>=3?(pt[0]==pt[1]?'Deuce':pt[0]>pt[1]?'AD - 40':'40 - AD'):f(pt[0])+' - '+f(pt[1])}document.getElementById('score').textContent=s;document.getElementById('sub').textContent=training?'训练场 · 无限回合':`第${set[0]+set[1]+1}盘 · ${game[0]} - ${game[1]}局`;document.getElementById('eb').style.width=P.ep+'%';document.getElementById('sb').style.width=P.st+'%';document.getElementById('ep').textContent=Math.round(P.ep);document.getElementById('co').textContent=combo}
function say(t){document.getElementById('msg').textContent=t}
function ball(){B.x=.5;B.y=.2;B.z=.07;B.vx=0;B.vy=0;B.vz=0;B.owner='ai';B.active=true}
function reset(){pt=[0,0];game=[0,0];set=[0,0];tb=false;tbp=[0,0];combo=0;rally=0;P.ep=0;P.st=100;ball();ui();say('你接发球')}
document.getElementById('start').onclick=()=>{training=false;run=true;document.getElementById('menu').classList.add('hide');reset()};document.getElementById('train').onclick=()=>{training=true;run=true;document.getElementById('menu').classList.add('hide');reset()};
document.getElementById('normal').onclick=()=>ai='normal';document.getElementById('hard').onclick=()=>ai='hard';document.getElementById('pro').onclick=()=>ai='pro';
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{shot=b.dataset.s;document.querySelectorAll('[data-s]').forEach(q=>q.classList.remove('on'));b.classList.add('on')});
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(P.ep<100){say('⚡ 能量不足');return}skill=b.dataset.k;P.ep=0;if(skill==='slow')slow=4;if(skill==='zone')zone=5;say(skill==='fire'?'🔥爆发就绪':skill==='slow'?'❄️ AI减速':'🎯 Zone就绪');ui()});
function xy(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
c.onpointerdown=e=>{if(!run)return;press=true;charge=0;let q=xy(e);P.tx=Math.max(.1,Math.min(.9,q.x))};
c.onpointermove=e=>{if(press){let q=xy(e);P.tx=Math.max(.1,Math.min(.9,q.x))}};
c.onpointerup=e=>{if(B.active&&B.owner==='ai'&&B.y>.57&&Math.abs(B.x-P.x)<(.18+(zone?.12:0)))hit();press=false;charge=0};
function hit(){let p=.032+.06*charge;if(shot==='serve')p=.06+.07*charge;if(shot==='lob')p*=.72;if(shot==='drop')p*=.52;if(shot==='smash')p*=1.38;if(shot==='volley')p*=1.18;if(skill==='fire')p*=1.7;B.owner='player';B.vx=(B.x-P.x)*.115;B.vy=-p;B.vz=.034+(shot==='topspin'?.026:shot==='slice'?.007:0);rally++;combo++;P.st=Math.max(0,P.st-(shot==='smash'?7:3));P.ep=Math.min(100,P.ep+10+(combo>=3?5:0));say(shot+' · '+(B.x<P.x?'反手':'正手'));skill='';zone=Math.max(0,zone-1);ui()}
function aiHit(){if(!B.active)return;let er=ai==='pro'?.008:ai==='hard'?.016:.035;B.owner='ai';B.vx=(P.x-A.x)*.105+(Math.random()-.5)*er;B.vy=(ai==='pro'?.043:ai==='hard'?.038:.034)+Math.random()*.027;B.vz=.025;B.active=true;rally++;say('AI回球')}
function point(w){if(training){rally=0;combo=0;ball();return}if(tb){tbp[w]++;if(tbp[w]>=7&&tbp[w]-tbp[1-w]>=2){set[w]++;tb=false;tbp=[0,0];game=[0,0];pt=[0,0];say(w?'你赢下抢七！':'AI赢下抢七！')}ball();ui();return}pt[w]++;if(pt[w]>=4&&pt[w]-pt[1-w]>=2){game[w]++;pt=[0,0];combo=0;if(game[w]>=6&&game[w]-game[1-w]>=2){set[w]++;game=[0,0];say(w?'你赢下一盘！':'AI赢下一盘！')}else if(game[0]===6&&game[1]===6){tb=true;tbp=[0,0];say('6-6！进入抢七')}else say(w?'你赢下一局！':'AI赢下一局!')}ball();ui()}
function update(dt){if(press)charge=Math.min(1,charge+dt*1.05);P.x+=(P.tx-P.x)*Math.min(1,dt*9);P.st=Math.min(100,P.st+dt*2);if(slow>0)slow-=dt;A.tx=Math.max(.1,Math.min(.9,B.x));A.x+=(A.tx-A.x)*Math.min(1,dt*(slow>0?.8:ai==='pro'?4.3:ai==='hard'?3.7:3));if(!B.active)return;B.x+=B.vx*dt*60;B.y+=B.vy*dt*60;B.z+=B.vz*dt*60;B.vz-=.0025*dt*60;if(B.x<.07){B.x=.07;B.vx=Math.abs(B.vx)}if(B.x>.93){B.x=.93;B.vx=-Math.abs(B.vx)}if(B.z<0){B.z=0;B.vz=Math.abs(B.vz)*.78}if(B.owner==='player'&&B.y<.18){B.owner='ai';setTimeout(aiHit,100)}if(B.owner==='ai'&&B.y>.79)B.owner='player';if(B.y<.01)point(0);if(B.y>.99)point(1)}
function person(px,py,me){x.save();x.translate(px,py);x.fillStyle='#efc6a4';x.beginPath();x.arc(0,-18,13,0,Math.PI*2);x.fill();x.fillStyle=me?'#2d68bd':'#a84848';x.fillRect(-16,-5,32,40);x.fillRect(-16,35,12,29);x.fillRect(4,35,12,29);x.strokeStyle='#fff';x.lineWidth=5;x.beginPath();x.moveTo(me?13:-13,4);x.lineTo(me?32:-32,20);x.stroke();x.restore()}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#061017';x.fillRect(0,0,W,H);let sc=Math.min(W/960,H/620),ox=(W-960*sc)/2,oy=(H-620*sc)/2;x.save();x.translate(ox,oy);x.scale(sc,sc);x.fillStyle='#143d2b';x.fillRect(0,0,960,620);x.fillStyle='#2e7b51';x.fillRect(60,45,840,530);x.strokeStyle='#fff';x.lineWidth=4;x.strokeRect(60,45,840,530);x.beginPath();x.moveTo(60,180);x.lineTo(900,180);x.moveTo(60,440);x.lineTo(900,440);x.moveTo(480,180);x.lineTo(480,440);x.stroke();x.lineWidth=8;x.beginPath();x.moveTo(52,310);x.lineTo(908,310);x.stroke();person(P.x*960,P.y*620,true);person(A.x*960,A.y*620,false);let bx=B.x*960,by=B.y*620-B.z*220;x.beginPath();x.arc(bx,by,7,0,Math.PI*2);x.fillStyle='#fff';x.fill();if(press){x.fillStyle='#fff5';x.fillRect(350,590,260,8);x.fillStyle='#fff';x.fillRect(350,590,260*charge,8)}x.restore()}
function loop(t){let dt=Math.min(.035,(t-last)/1000||.016);last=t;if(run)update(dt);draw();requestAnimationFrame(loop)}ui();requestAnimationFrame(loop);
</script></body></html>
