<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07131a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<title>Tennis Smash 2026 V4</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061017;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial;color:#fff;touch-action:none}
button{font:inherit;color:#fff;background:#08161de8;border:1px solid #ffffff35;border-radius:12px;font-weight:800}
#c{position:fixed;inset:0;width:100%;height:100%}#rotate{display:none;position:fixed;inset:0;z-index:50;background:#061017;align-items:center;justify-content:center;text-align:center;font-size:22px;font-weight:900}
@media(orientation:portrait){#rotate{display:flex}}
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 6px #000}.score{position:absolute;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:29px;font-weight:950}.sub{position:absolute;top:48px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap}.msg{position:absolute;top:70px;left:50%;transform:translateX(-50%);font-size:14px;font-weight:850;white-space:nowrap}
#stats{position:absolute;left:11px;top:max(10px,env(safe-area-inset-top));width:205px}.bar{height:8px;background:#0009;border:1px solid #ffffff25;border-radius:8px;overflow:hidden;margin-bottom:5px}.bar i{display:block;height:100%;width:100%}.e{background:#fff}.s{background:#9bc9ff}.xp{font-size:11px}
#shots{position:absolute;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,clamp(58px,8vw,78px));gap:6px;pointer-events:auto}#shots button{min-height:39px;font-size:11px}#shots .on{background:#fff;color:#061017}
#skills{position:absolute;left:10px;bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:6px;pointer-events:auto}#skills button{min-width:78px;min-height:39px;font-size:11px}.off{opacity:.32}
#charge{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:240px;height:8px;background:#0009;border:1px solid #fff5;border-radius:8px;overflow:hidden;display:none}#charge i{display:block;height:100%;width:0;background:#fff}
.overlay{position:fixed;inset:0;z-index:20;background:#000b;display:flex;align-items:center;justify-content:center;padding:18px}.hide{display:none!important}.card{width:min(92vw,520px);background:linear-gradient(160deg,#112b35f5,#07151cf5);border:1px solid #ffffff25;border-radius:25px;padding:24px;box-shadow:0 25px 80px #000;text-align:center}.card h1{margin:0 0 4px;font-size:31px}.muted{color:#aabac1;font-size:13px}.row{display:flex;gap:8px;margin:10px 0}.row button{flex:1;padding:11px}.primary{background:#fff;color:#07131a!important;border-color:#fff!important}.small{font-size:12px;line-height:1.6;color:#aabac1;margin-top:14px}
#toast{position:fixed;z-index:40;left:50%;top:43%;transform:translate(-50%,-50%);font-size:24px;font-weight:950;opacity:0;pointer-events:none;text-shadow:0 3px 12px #000;transition:opacity .15s}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="rotate">🎾 请横屏<br><small style="font-size:12px;color:#9fb1b8">横屏后开始比赛</small></div>
<div id="hud">
<div class="score" id="score">0 - 0</div><div class="sub" id="sub">第一盘 · 普通局</div><div class="msg" id="msg">准备发球</div>
<div id="stats"><div class="bar"><i class="e" id="eb"></i></div><div class="bar"><i class="s" id="sb"></i></div><div class="xp">⚡ <b id="ep">0</b>/100　🔥 连击 <b id="combo">0</b></div></div>
<div id="skills"><button data-k="power">🔥爆发</button><button data-k="freeze">❄️减速</button><button data-k="zone">🎯Zone</button></div>
<div id="shots"><button data-s="flat">平击</button><button data-s="topspin" class="on">上旋</button><button data-s="slice">切削</button><button data-s="lob">高吊</button><button data-s="drop">放小球</button><button data-s="volley">截击</button><button data-s="smash">扣杀</button><button data-s="serve">发球</button></div>
<div id="charge"><i id="chargei"></i></div></div><div id="toast"></div>

<div id="menu" class="overlay"><div class="card"><h1>🎾 Tennis Smash 2026 V4</h1><div class="muted">移动端网页版 · 完整比赛核心</div>
<div class="row"><button class="primary" id="quick">快速比赛</button><button id="train">训练场</button></div>
<div class="row"><button id="normal">AI 普通</button><button id="hard">AI 困难</button><button id="pro">AI Pro</button></div>
<div class="small">V4 新增：15/30/40/Deuce、抢七、三盘制、发球局、破发、体力、连击、技能、落点区、球速/旋转反馈、回合统计、训练模式。</div></div></div>
<div id="pause" class="overlay hide"><div class="card"><h1>暂停</h1><div class="row"><button class="primary" id="resume">继续</button><button id="restart">重新开始</button></div></div></div>
<div id="result" class="overlay hide"><div class="card"><h1 id="rt">比赛结束</h1><div id="rs" style="font-size:52px;font-weight:950;margin:10px">0 - 0</div><div class="muted" id="detail"></div><div class="row"><button class="primary" id="again">再来一场</button></div></div></div>

<script>
const C=document.getElementById('c'),g=C.getContext('2d');let W,H,D=1,last=0,started=false,training=false;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();

const court={l:.07,r:.93,t:.07,b:.93,net:.5};
const P={x:.5,y:.80,tx:.5,st:100,ep:0};const A={x:.5,y:.20,tx:.5,st:100};
const B={x:.5,y:.5,z:.05,vx:0,vy:0,vz:0,owner:'ai',active:false,spin:0,speed:0};
let pts=[0,0],games=[0,0],sets=[0,0],tb=false,tbpts=[0,0],server=0,shot='topspin',skill=null,charge=0,pointer=false,combo=0,rally=0;
let aiMode='normal',slow=0,zone=0,serveFault=false,stats={aces:0,winners:0};

function scoreName(n){return ['0','15','30','40'][Math.min(n,3)]}
function scoreText(){if(training)return '训练 · '+rally+' 回合';if(tb)return '抢七 '+tbpts[0]+' - '+tbpts[1];let a=pts[0],b=pts[1];if(a>=3&&b>=3){if(a===b)return 'Deuce';if(a===b+1)return 'AD - 40';if(b===a+1)return '40 - AD'}return scoreName(a)+' - '+scoreName(b)}
function UI(){document.getElementById('score').textContent=scoreText();document.getElementById('sub').textContent=training?'训练场 · 无限回合':`第${sets[0]+sets[1]+1}盘 · ${games[0]} - ${games[1]} 局 · ${server===0?'你发球':'AI 发球'}`;document.getElementById('eb').style.width=P.ep+'%';document.getElementById('sb').style.width=P.st+'%';document.getElementById('ep').textContent=Math.round(P.ep);document.getElementById('combo').textContent=combo}
function msg(t){document.getElementById('msg').textContent=t}
function pop(t){let e=document.getElementById('toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,650)}
function newBall(owner='ai',isServe=false){B.x=.5;B.y=owner==='ai'?.20:.80;B.z=isServe?.08:.04;B.vx=0;B.vy=0;B.vz=0;B.owner=owner;B.active=true;B.spin=0;B.speed=0}
function matchReset(){pts=[0,0];games=[0,0];sets=[0,0];tb=false;tbpts=[0,0];server=0;P.ep=0;P.st=100;combo=0;rally=0;stats={aces:0,winners:0};skill=null;newBall('ai',true);UI();msg('你接发球')}
function chooseShot(s){shot=s;document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===s))}
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>chooseShot(b.dataset.s));
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>activate(b.dataset.k));
function activate(k){if(P.ep<100){msg('⚡ 能量不足');return}skill=k;P.ep=0;if(k==='power')msg('🔥 爆发：下一球威力提升');if(k==='freeze'){slow=4;msg('❄️ AI 减速 4 秒');pop('SLOW MOTION')}if(k==='zone'){zone=5;msg('🎯 Zone：5 次扩大击球窗口');pop('ZONE')};UI()}
function hit(){
 let q=charge,pow=.030+.060*q,dx=B.x-P.x;
 if(shot==='serve')pow=.058+.075*q;if(shot==='lob')pow*=.72;if(shot==='drop')pow*=.50;if(shot==='smash')pow*=1.38;if(shot==='volley')pow*=1.18;
 if(skill==='power')pow*=1.72;
 if(P.st<20)pow*=.75;
 let accuracy=Math.max(.45,1-Math.abs(dx)*1.7);
 if(skill==='zone')accuracy=Math.min(1,accuracy+.35);
 let miss=Math.random()>(.90*accuracy);
 if(miss){B.owner='player';B.vx=dx*.22+(Math.random()-.5)*.08;B.vy=-pow*.55;B.vz=.01;msg('失误！球出界');combo=0;skill=null;zone=Math.max(0,zone-1);return}
 B.owner='player';B.vx=dx*.115+(Math.random()-.5)*.012;B.vy=-pow;B.vz=.032+(shot==='topspin'?.026:shot==='slice'?.006:0);B.spin=shot;B.speed=Math.round(pow*1550);
 rally++;combo++;P.st=Math.max(0,P.st-(shot==='smash'?7:3));P.ep=Math.min(100,P.ep+9+(combo>=3?5:0));
 let label=shot==='flat'?'平击':shot==='topspin'?'上旋':shot==='slice'?'切削':shot==='lob'?'高吊':shot==='drop'?'放小球':shot==='volley'?'截击':shot==='smash'?'扣杀':'发球';
 msg((skill==='power'?'🔥 ':'')+label+' · '+(B.x<P.x?'反手':'正手')+' · '+B.speed+' km/h');if(shot==='smash'||shot==='flat')stats.winners++;skill=null;zone=Math.max(0,zone-1);UI()
}
function aiHit(){
 if(!B.active)return;
 let err=aiMode==='pro'?.008:aiMode==='hard'?.016:.035;let dx=P.x-A.x,roll=Math.random(),pow=(aiMode==='pro'?.043:aiMode==='hard'?.038:.034)+Math.random()*.027;
 if(roll<.09)pow*=.68;if(roll>.9)B.vz+=.018;
 B.owner='ai';B.vx=dx*.105+(Math.random()-.5)*err;B.vy=pow;B.vz=.024+(roll>.8?.022:0);B.speed=Math.round(pow*1500);rally++;msg('AI 回球 · '+B.speed+' km/h')
}
function point(who){
 if(training){newBall('ai');rally=0;combo=0;msg('训练继续');return}
 if(tb){tbpts[who]++;UI();if(tbpts[who]>=7&&tbpts[who]-tbpts[1-who]>=2){endGame(who,true)}else{server=tbpts.reduce((a,b)=>a+b,0)%2===0?server:1-server;newBall('ai',true);msg('抢七继续')}return}
 pts[who]++;UI();
 if(pts[who]>=4&&pts[who]-pts[1-who]>=2){games[who]++;pts=[0,0];combo=0;server=1-server;UI();if(games[who]>=6&&games[who]-games[1-who]>=2){endSet(who)}else if(games[0]===6&&games[1]===6){tb=true;tbpts=[0,0];UI();newBall('ai',true);msg('6-6！进入抢七')}else{newBall('ai',true);msg(who===0?'破发/保发！':'AI 赢下一局')}}else{newBall('ai',true);msg(who===0?'得分！':'AI 得分')}
}
function endSet(who){sets[who]++;B.active=false;if(sets[who]>=2||sets[1-who]>=2){document.getElementById('rt').textContent=who===0?'🏆 你赢了比赛':'AI 赢下比赛';document.getElementById('rs').textContent=sets[0]+' - '+sets[1];document.getElementById('detail').textContent=`局数 ${games[0]} - ${games[1]} · ACE ${stats.aces} · 制胜分 ${stats.winners}`;document.getElementById('result').classList.remove('hide');started=false}else{games=[0,0];pts=[0,0];tb=false;tbpts=[0,0];server=1-server;newBall('ai',true);UI();msg('新的一盘开始')}}
function endGame(who){endSet(who)}
function pos(e){let r=C.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
C.addEventListener('pointerdown',e=>{if(!started)return;pointer=true;charge=0;C.setPointerCapture(e.pointerId);let q=pos(e);P.tx=Math.max(court.l+.02,Math.min(court.r-.02,q.x));document.getElementById('charge').style.display='block'});
C.addEventListener('pointermove',e=>{if(!pointer)return;let q=pos(e);P.tx=Math.max(court.l+.02,Math.min(court.r-.02,q.x))});
C.addEventListener('pointerup',()=>{if(B.active&&B.owner==='ai'&&B.y>.57&&Math.abs(B.x-P.x)<(.16+(zone?.12:0)))hit();pointer=false;charge=0;document.getElementById('charge').style.display='none'});
C.addEventListener('pointercancel',()=>{pointer=false;charge=0;document.getElementById('charge').style.display='none'});
document.getElementById('quick').onclick=()=>{training=false;started=true;document.getElementById('menu').classList.add('hide');matchReset()};
document.getElementById('train').onclick=()=>{training=true;started=true;document.getElementById('menu').classList.add('hide');matchReset()};
document.getElementById('normal').onclick=()=>{aiMode='normal';msg('AI 普通')};document.getElementById('hard').onclick=()=>{aiMode='hard';msg('AI 困难')};document.getElementById('pro').onclick=()=>{aiMode='pro';msg('AI Pro')};
document.getElementById('resume').onclick=()=>document.getElementById('pause').classList.add('hide');document.getElementById('restart').onclick=()=>{document.getElementById('pause').classList.add('hide');matchReset()};document.getElementById('again').onclick=()=>{document.getElementById('result').classList.add('hide');started=true;matchReset()};
addEventListener('keydown',e=>{if(e.key==='Escape'&&started)document.getElementById('pause').classList.remove('hide')});
function update(dt){
 if(pointer)charge=Math.min(1,charge+dt*1.05);document.getElementById('chargei').style.width=(charge*100)+'%';
 P.x+=(P.tx-P.x)*Math.min(1,dt*9);P.st=Math.min(100,P.st+dt*2.2);A.st=Math.min(100,A.st+dt*2);
 if(slow>0)slow-=dt;let speed=slow>0?.8:(aiMode==='pro'?4.4:aiMode==='hard'?3.8:3.1);A.tx=Math.max(court.l+.03,Math.min(court.r-.03,B.x));A.x+=(A.tx-A.x)*Math.min(1,dt*speed);
 if(!B.active)return;B.x+=B.vx*dt*60;B.y+=B.vy*dt*60;B.z+=B.vz*dt*60;B.vz-=.0025*dt*60;
 if(B.x<court.l){B.x=court.l;B.vx=Math.abs(B.vx)}if(B.x>court.r){B.x=court.r;B.vx=-Math.abs(B.vx)}
 if(B.z<0){B.z=0;B.vz=Math.abs(B.vz)*.78}
 if(B.owner==='player'&&B.y<.18){B.owner='ai';setTimeout(()=>{if(B.active&&B.owner==='ai')aiHit()},100)}
 if(B.owner==='ai'&&B.y>.79){B.owner='player';msg('接球！移动到球附近');}
 if(B.y<.012)point(0);if(B.y>.988)point(1)
}
function player(px,py,me){
 g.save();g.translate(px,py);g.fillStyle='#efc6a4';g.beginPath();g.arc(0,-20,14,0,Math.PI*2);g.fill();g.fillStyle=me?'#2b64ba':'#a54747';g.fillRect(-17,-6,34,43);g.fillRect(-17,37,13,31);g.fillRect(4,37,13,31);g.strokeStyle='#eee';g.lineWidth=5;g.beginPath();g.moveTo(me?14:-14,4);g.lineTo(me?33:-33,21);g.stroke();g.fillStyle='#fff';g.font='bold 13px Arial';g.textAlign='center';g.fillText(me?'YOU':'AI',0,83);g.restore()
}
function draw(){
 g.clearRect(0,0,W,H);g.fillStyle='#061017';g.fillRect(0,0,W,H);let sc=Math.min(W/960,H/620),ox=(W-960*sc)/2,oy=(H-620*sc)/2;g.save();g.translate(ox,oy);g.scale(sc,sc);
 g.fillStyle='#143b29';g.fillRect(0,0,960,620);g.fillStyle='#2c7950';g.fillRect(65,50,830,520);g.strokeStyle='#fff';g.lineWidth=4;g.strokeRect(65,50,830,520);g.beginPath();g.moveTo(65,180);g.lineTo(895,180);g.moveTo(65,440);g.lineTo(895,440);g.moveTo(480,180);g.lineTo(480,440);g.stroke();g.lineWidth=8;g.beginPath();g.moveTo(55,310);g.lineTo(905,310);g.stroke();g.lineWidth=2;g.strokeStyle='#aaa';g.beginPath();g.moveTo(65,310);g.lineTo(895,310);g.stroke();
 player(P.x*960,P.y*620,true);player(A.x*960,A.y*620,false);
 let bx=B.x*960,by=B.y*620-B.z*220;g.beginPath();g.arc(bx,by,7+B.z*6,0,Math.PI*2);g.fillStyle='#fff';g.fill();g.strokeStyle='#222';g.stroke();
 if(B.speed>85){g.strokeStyle='#ffffff88';g.lineWidth=2;g.beginPath();g.moveTo(bx-B.vx*2500,by+B.vy*1000);g.lineTo(bx,by);g.stroke()}
 if(special==='power'){g.font='28px Arial';g.fillText('🔥',bx+12,by-12)}
 if(pointer){g.fillStyle='#fff4';g.fillRect(350,590,260,8);g.fillStyle='#fff';g.fillRect(350,590,260*charge,8)}
 g.restore()
}
function loop(t){let dt=Math.min(.035,(t-last)/1000||.016);last=t;if(started){update(dt);UI()}draw();requestAnimationFrame(loop)}UI();requestAnimationFrame(loop);
</script>
</body></html>
