<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#061017">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Tennis Smash 2026</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061017;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 4px #000c}
#board{position:absolute;top:calc(6px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}
#score{font-size:26px;font-weight:900;letter-spacing:1px;line-height:1.15}
#sub{font-size:12px;opacity:.9}
#msg{margin-top:3px;font-size:14px;font-weight:800;min-height:18px}
#stats{position:absolute;left:10px;top:calc(10px + env(safe-area-inset-top));width:118px;font-size:11px}
.bar{height:7px;background:#0009;border:1px solid #fff4;border-radius:7px;margin-bottom:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0}
#eb{background:linear-gradient(90deg,#ffd84a,#ff8a3d)}#sb{background:#7fc4ff}
#tools{position:absolute;right:10px;top:calc(8px + env(safe-area-inset-top));display:flex;gap:6px;pointer-events:auto}
#tools button{width:38px;height:38px;min-height:0;padding:0;font-size:16px}
button{font:inherit;color:#fff;background:#07161de6;border:1px solid #fff4;border-radius:12px;min-height:42px;font-weight:800;font-size:14px;cursor:pointer;padding:0 4px}
button.on{background:#fff;color:#061017}
button.ready{border-color:#ffd84a;box-shadow:0 0 10px #ffd84a99}
#skills,#shots{position:absolute;display:flex;gap:6px;pointer-events:auto}
#shots{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom))}
#skills{left:8px;right:8px;bottom:calc(56px + env(safe-area-inset-bottom))}
#skills button,#shots button{flex:1;min-width:0}
#shots button[data-net].on{background:#ffd84a;color:#061017}
@media (orientation:landscape){
  #skills{left:calc(8px + env(safe-area-inset-left));right:auto;bottom:8px;flex-direction:column;width:112px}
  #shots{left:auto;right:calc(8px + env(safe-area-inset-right));bottom:8px;display:grid;grid-template-columns:1fr 1fr;width:128px}
  #stats{width:112px}
}
.panel{position:fixed;inset:0;z-index:5;background:#000b;display:flex;align-items:center;justify-content:center}
.card{width:min(90vw,460px);max-height:94vh;overflow:auto;padding:20px;background:#10262ff7;border:1px solid #fff3;border-radius:22px;text-align:center}
.card h1{margin:0 0 12px;font-size:24px}.card h2{margin:0 0 12px}
.row{display:flex;gap:8px;margin:9px 0}.row button{flex:1;padding:10px 4px}
.label{font-size:12px;opacity:.7;margin-top:10px;text-align:left}
.primary{background:#fff;color:#061017}
.help{font-size:13px;line-height:1.6;opacity:.9;text-align:left;margin:12px 0 4px}
.rec{font-size:12px;opacity:.7;margin:6px 0 0}
#overS{font-size:14px;line-height:1.8;margin:8px 0}
.hide{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="board"><div id="score">0 - 0</div><div id="sub"></div><div id="msg"></div></div>
  <div id="stats"><div class="bar"><i id="eb"></i></div><div class="bar"><i id="sb"></i></div>⚡<b id="ep">0</b>/100 🔥连击 <b id="co">0</b></div>
  <div id="tools"><button id="mute">🔊</button><button id="pauseBtn">⏸</button></div>
  <div id="skills"><button data-k="fire">🔥爆发</button><button data-k="slow">❄️减速</button><button data-k="zone">🎯Zone</button></div>
  <div id="shots"><button data-s="topspin" class="on">上旋</button><button data-s="flat">平击</button><button data-s="slice">切削</button><button data-s="lob">高吊</button><button data-s="drop">放小球</button><button data-net="1">🏃上网</button></div>
</div>

<div id="menu" class="panel"><div class="card">
  <h1>🎾 Tennis Smash 2026</h1>
  <div class="label">AI 难度</div>
  <div class="row" id="lvRow"><button data-lv="normal">普通</button><button data-lv="hard">困难</button><button data-lv="pro">Pro</button></div>
  <div class="label">比赛长度</div>
  <div class="row" id="lenRow"><button data-len="4">短盘 · 先赢4局</button><button data-len="6">一盘 · 先赢6局</button></div>
  <div class="row"><button id="start" class="primary">开始比赛</button><button id="train">训练场</button></div>
  <p class="help">👉 球飞过来时<b>在屏幕上滑一下</b>就是挥拍：往左上滑打左边，往右上滑打右边，点一下打中路。<br>⭕ 光圈缩到球上、<b style="color:#7CFF8A">变绿</b>时出手 = PERFECT。<br>🏃 人物会自动跑位，你只管时机和方向。</p>
  <p class="rec" id="rec"></p>
</div></div>

<div id="pause" class="panel hide"><div class="card"><h2>⏸ 暂停</h2>
  <div class="row"><button id="resume" class="primary">继续</button><button id="quit">退出到菜单</button></div>
</div></div>

<div id="over" class="panel hide"><div class="card"><h1 id="overT"></h1><div id="overS"></div>
  <div class="row"><button id="again" class="primary">再来一场</button><button id="back">菜单</button></div>
</div></div>

<script>
'use strict';
// ================= 常量（单位：米 / 秒）=================
// 坐标：x 横向（右为正），y 纵向（你在 y>0 一侧，AI 在 y<0 一侧，球网在 y=0），z 高度
const HW = 4.115, HL = 11.885, SVC = 6.40, DHW = 5.485, G = 9.8, DT = 1 / 120;
const TOSS_IDEAL = 0.887;   // 抛球后最佳击球时间（球下落到约 2.7m）
const EARLY = 0.42;         // 提前挥拍可缓冲的时间窗
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');

const LV = {
  normal: { name: '普通', move: 5.2, reach: 1.25, react: .28, speed: 19, err: 1.3, depth: 7.8, aim: 1.8, srv: 30, srvErr: .95, netErr: .07, outErr: .07 },
  hard:   { name: '困难', move: 6.2, reach: 1.4,  react: .2,  speed: 23, err: .95, depth: 8.8, aim: 2.6, srv: 35, srvErr: .75, netErr: .045, outErr: .045 },
  pro:    { name: 'Pro',  move: 7.2, reach: 1.55, react: .14, speed: 26, err: .6,  depth: 9.6, aim: 3.1, srv: 40, srvErr: .55, netErr: .025, outErr: .025 },
};
const SHOTS = {
  topspin: { name: '上旋',   speed: 24, depth: 9.2, spin: 'top',   err: .8,  margin: .35, st: 1.5 },
  flat:    { name: '平击',   speed: 30, depth: 9.6, spin: 'flat',  err: 1.15, margin: .12, st: 3 },
  slice:   { name: '切削',   speed: 19, depth: 8.6, spin: 'slice', err: .75, margin: .3,  st: 1.5 },
  lob:     { name: '高吊',   speed: 12, depth: 9.9, spin: 'top',   err: .9,  margin: .9,  st: 1.5 },
  drop:    { name: '放小球', speed: 10, depth: 2.4, spin: 'drop',  err: .9,  margin: .1,  st: 1 },
  smash:   { name: '扣杀',   speed: 33, depth: 8.6, spin: 'flat',  err: .9,  margin: .15, st: 4 },
  volley:  { name: '截击',   speed: 21, depth: 8.2, spin: 'flat',  err: .8,  margin: .2,  st: 1.5 },
};
// g: 额外下坠（上旋更快下坠）；e: 落地弹性；f: 落地后水平保留
const SPIN = { flat: { g: 0, e: .72, f: .8 }, top: { g: 4.2, e: .8, f: .86 }, slice: { g: -2, e: .55, f: .7 }, drop: { g: -1, e: .45, f: .5 } };

// ================= 存档 =================
const S = (() => { const d = { level: 'normal', setLen: 4, mute: false, wins: 0, losses: 0, bestRally: 0, bestCombo: 0 };
  try { return Object.assign(d, JSON.parse(localStorage.getItem('ts2026') || '{}')) } catch (e) { return d } })();
function save() { try { localStorage.setItem('ts2026', JSON.stringify(S)) } catch (e) {} }

// ================= 状态 =================
let mode = 'menu';          // menu | match | train
let phase = 'idle';         // serve | rally | dead | idle
let paused = false, now = 0, acc = 0, lastT = 0;
const P = { x: 0, y: HL + .8, st: 100, ep: 0, swing: 0, sdir: 1, run: 0, me: true };
const A = { x: 0, y: -HL - .8, swing: 0, sdir: 1, run: 0, me: false };
const ball = { x: 0, y: 0, z: 1, vx: 0, vy: 0, vz: 0, spin: 'flat', vis: false, netDone: false, roll: false };
let R = null;               // 当前这一拍的规则状态 {hitter, serve, bounces, box}
let plan = null;            // 下一次击球点 {side, x, y, z, t, kind, made}
let buffered = null;        // 提前挥拍缓冲 {ts, aim}
let toss = null;            // 发球抛球 {t0, server}
let sc = null;              // 比分
let st = null;              // 本场数据
let combo = 0, rallyHits = 0, fire = false, slowT = 0, zoneN = 0, shot = 'topspin', netMode = false;
let deadT = 0, nextFn = null;
let fx = [], marks = [], trail = [];

// ================= 物理 =================
function netH(x) { const a = Math.min(1, Math.abs(x) / 5.03); return .914 + .155 * a * a }
function step(b, dt) {
  if (b.roll) { b.x += b.vx * dt; b.y += b.vy * dt; b.vx *= 1 - 1.5 * dt; b.vy *= 1 - 1.5 * dt; return null }
  const sp = SPIN[b.spin], py = b.y, pz = b.z;
  b.vz -= (G + sp.g) * dt;
  b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
  if (!b.netDone && (py > 0) !== (b.y > 0) && Math.abs(b.x) < 5.6) {
    b.netDone = true;
    const f = py / (py - b.y), zc = pz + (b.z - pz) * f;
    if (zc < netH(b.x)) { b.y = py > 0 ? .08 : -.08; b.vy *= -.12; b.vx *= .3; b.vz = Math.min(b.vz, 0); return 'net' }
  }
  if (b.z < 0) {
    b.z = 0; b.vz = -b.vz * sp.e; b.vx *= sp.f; b.vy *= sp.f;
    if (b.vz < .5) { b.vz = 0; b.roll = true }
    return 'bounce';
  }
  return null;
}
// 计算一拍的初速度：保证落在 (tx,ty)，并且过网高度至少 netH+margin（不够就降速抬高弧线）
function launch(from, tx, ty, v, spin, margin) {
  const g = G + SPIN[spin].g; let vel;
  for (let i = 0; i < 20; i++) {
    const dx = tx - from.x, dy = ty - from.y, d = Math.hypot(dx, dy), T = d / v;
    vel = { vx: dx / T, vy: dy / T, vz: (.5 * g * T * T - from.z) / T };
    if ((from.y > 0) === (ty > 0)) break;
    const tn = -from.y / vel.vy, zn = from.z + vel.vz * tn - .5 * g * tn * tn;
    if (zn >= netH(from.x + vel.vx * tn) + margin) break;
    v *= .94;
  }
  return vel;
}
const inCourt = (x, y) => Math.abs(x) <= HW + .04 && Math.abs(y) <= HL + .04;
const inBox = (x, y, box) => (box.side === 0 ? y > 0 : y < 0) && Math.abs(y) <= SVC + .04 && x * box.sx >= -.04 && Math.abs(x) <= HW + .04;
const sideSign = side => side === 0 ? 1 : -1;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);

// 预测 side 一方的击球点（跟主循环同一套物理，所以完全一致）
function predict(side, serve, box) {
  const b = Object.assign({}, ball), s = sideSign(side);
  let t = 0, bounced = false, apex = b.z;
  const o = side === 0 ? P : A;
  const mk = kind => ({ side, x: b.x, y: b.y, z: b.z, t: now + t, kind, made: now, ox: o.x, oy: o.y });
  for (let i = 0; i < 720; i++) {
    const ev = step(b, DT); t += DT;
    if (b.z > apex) apex = b.z;
    if (ev === 'net') return null;
    const yy = b.y * s;
    if (ev === 'bounce') {
      if (bounced) return null;
      bounced = true;
      if (yy < 0 || !(serve ? inBox(b.x, b.y, box) : inCourt(b.x, b.y))) return null; // 出界的球不接
    }
    if (!bounced && !serve && yy > 1) {
      if (b.vz < 0 && b.z <= 2.9 && b.z >= 2.1 && apex > 4.2 && yy < 8.5) return mk('smash');
      if (side === 0 && netMode) {
        const meet = Math.max(2.6, Math.abs(P.y) - 6.5 * t);
        if (yy >= meet && b.z <= 2.5 && b.z >= .25) return mk('volley');
      }
    }
    if (bounced && ((b.vz < 0 && b.z <= 1.05) || b.roll || yy >= HL + 2.2)) return mk('ground');
    if (yy > HL + 6) return null;
  }
  return null;
}

// ================= 击球 =================
function hitBall(side, from, tx, ty, v, spin, margin, serve, box) {
  const vel = launch(from, tx, ty, v, spin, margin);
  Object.assign(ball, from, vel, { spin, vis: true, netDone: false, roll: false });
  R = { hitter: side, serve: !!serve, bounces: 0, box };
  const who = side === 0 ? P : A;
  who.swing = 1; who.sdir = (from.x >= who.x ? 1 : -1) * (side === 0 ? 1 : -1);
  plan = predict(1 - side, serve, box);
  buffered = null; trail = [];
  snd('hit');
}
function errDisc(r) { const d = r * Math.sqrt(Math.random()), a = Math.random() * Math.PI * 2; return [d * Math.cos(a), d * Math.sin(a) * 1.25] }
function quality(d) {
  const pw = zoneN > 0 ? .12 : .065;
  if (Math.abs(d) <= pw) return 'perfect';
  if (Math.abs(d) <= .16) return 'good';
  return d > 0 ? 'early' : 'late';
}
const QTXT = { perfect: ['PERFECT!', '#7CFF8A'], good: ['GOOD', '#ffffff'], early: ['偏早', '#ffd27a'], late: ['偏晚', '#ffd27a'] };

// 玩家挥拍（滑动/点击）。aim: -1(左) ~ 1(右)，null=中路
function swing(aim) {
  if (paused || mode === 'menu') return;
  audioInit();
  if (phase === 'serve' && toss && toss.server === 0) {
    const t = now - toss.t0, d = TOSS_IDEAL - t;
    if (t < .1 || d > EARLY) { pop('等球抛高再挥', P.x, P.y, 2.2, '#ffd27a'); return }
    serve(0, d, aim); return;
  }
  if (phase !== 'rally' || !plan || plan.side !== 0 || buffered) return;
  const d = plan.t - now;
  if (d > EARLY) { pop('太早', P.x, P.y, 2.2, '#ffd27a'); return }
  if (d >= 0) { buffered = { ts: now, aim }; return }
  playerContact(now, aim);
}
function stretch(pl, spd, react) {
  const avail = Math.max(.15, pl.t - pl.made - react);
  return clamp((Math.hypot(pl.x - pl.ox, pl.y - pl.oy) / (spd * avail) - .55) / .45, 0, 1);
}
function lateWin() { return zoneN > 0 ? .25 : .15 }
function playerContact(ts, aim) {
  const pl = plan; plan = null; buffered = null;
  const reach = 1.5 + (zoneN > 0 ? .8 : 0);
  if (Math.hypot(P.x - pl.x, P.y - pl.y) > reach) { pop('够不到！', P.x, P.y, 2.2, '#ff7a7a'); return }
  const q = quality(pl.t - ts);
  const base = pl.kind === 'smash' ? SHOTS.smash : pl.kind === 'volley' ? SHOTS.volley : SHOTS[shot];
  let v = base.speed, err = base.err, margin = base.margin;
  if (q === 'perfect') { v *= 1.08; err *= .45; margin += .12; st.perfect++ }
  else if (q === 'good') err *= .8;
  else { v *= .92; err *= 1.45; margin -= .3 }
  if (shot === 'drop' && pl.kind === 'ground') err *= Math.max(1, Math.abs(pl.y) / 8);   // 底线放小球很难
  err *= (1 + .7 * (1 - P.st / 100)) * (1 + 1.2 * stretch(pl, 7.2, 0)) * (1 + .06 * rallyHits);
  if (fire) { v *= 1.28; err *= .7; fire = false; pop('🔥', pl.x, pl.y, 2.6, '#ff8a3d') }
  if (zoneN > 0) zoneN--;
  let tx = (aim == null ? 0 : aim) * 3.4, ty = -base.depth;
  const [ex, ey] = errDisc(err); tx += ex; ty = Math.min(-.3, ty + ey);
  hitBall(0, { x: pl.x, y: pl.y, z: pl.z }, tx, ty, v, base.spin, margin);
  combo++; rallyHits++; st.hits++;
  S.bestCombo = Math.max(S.bestCombo, combo);
  P.st = Math.max(0, P.st - base.st);
  P.ep = Math.min(100, P.ep + 8 + (q === 'perfect' ? 6 : 0) + (combo >= 3 ? 3 : 0));
  const [qt, qc] = QTXT[q];
  pop(qt, pl.x, pl.y, 2.4, qc);
  say(base.name + (tx < -1.2 ? ' · 打左路' : tx > 1.2 ? ' · 打右路' : ' · 中路'));
  vibrate(12); ui();
}

function aiContact() {
  const pl = plan; plan = null;
  const L = LV[S.level], train = mode === 'train';
  const d = Math.hypot(A.x - pl.x, A.y - pl.y);
  if (!train && d > L.reach) { pop('AI够不到', A.x, A.y, 2.2, '#9fe0ff'); return }
  let tx, ty, v = L.speed, spin = 'top', err = L.err, margin = .3;
  const strain = train ? 0 : stretch(pl, L.move, L.react);
  err *= (1 + 1.6 * strain) * (1 + .06 * rallyHits);
  if (strain > .5) say('AI 被调动了！');
  if (pl.kind === 'smash') { v = 31; spin = 'flat'; tx = (P.x > 0 ? -1 : 1) * 2.8; ty = 8.2 }
  else if (!train && P.y < 6.5) {                       // 你上网了：挑高球或穿越
    if (Math.random() < .45) { v = 12.5; ty = HL - 1.4; tx = rnd(-2, 2); margin = .9 }
    else { tx = (P.x > 0 ? -1 : 1) * 3.2; ty = 6.8; v += 3 }
  } else if (!train && S.level !== 'normal' && P.y > HL - .3 && Math.abs(pl.y) < HL - 1.5 && Math.random() < (S.level === 'pro' ? .14 : .08)) {
    spin = 'drop'; v = 10; ty = 2.4; tx = rnd(-2.5, 2.5); err *= .7;  // AI 放小球
  } else {
    const away = P.x > 0 ? -1 : 1;
    tx = away * L.aim * rnd(.55, 1); if (Math.random() < .25) tx = -tx * .5;
    ty = L.depth + rnd(-.6, .6);
    if (Math.random() < .2) { spin = 'slice'; v -= 4 }
  }
  if (train) { tx = rnd(-2.2, 2.2); ty = 8.5; v = 17; err = .25; spin = 'top' }
  if (slowT > 0) v *= .85;
  v *= 1 - .2 * strain; if (ty > 4) ty -= 2.5 * strain;
  let [ex, ey] = errDisc(err); tx += ex; ty = Math.max(.3, ty + ey);
  if (!train) {
    if (Math.random() < L.outErr) { if (Math.random() < .5) tx = Math.sign(tx || 1) * rnd(HW + .2, HW + 1); else ty = rnd(HL + .2, HL + 1.2) }
    if (Math.random() < L.netErr) margin = -.35;
  }
  hitBall(1, { x: pl.x, y: pl.y, z: pl.z }, tx, ty, v, spin, margin);
}

// ================= 发球 =================
function startPoint() {
  phase = 'serve'; plan = null; buffered = null; R = null; trail = [];
  if (mode === 'train') { phase = 'rally'; feed(); return }
  const srv = sc.server, deuce = (sc.pts[0] + sc.pts[1]) % 2 === 0;
  const sx = srv === 0 ? (deuce ? 1 : -1) : (deuce ? -1 : 1);   // 发球站位（从各自视角站右边=平分区）
  const box = { sx: -sx, side: 1 - srv };
  const server = srv === 0 ? P : A, recv = srv === 0 ? A : P, ss = sideSign(srv);
  server.x = sx * .9; server.y = ss * (HL + .25);
  recv.x = -sx * 2.4; recv.y = -ss * (HL + .9);
  toss = { t0: now + (srv === 0 ? .6 : 1.0), server: srv, box, jit: rnd(-.05, .05) };
  Object.assign(ball, { x: server.x + .35 * ss, y: server.y, z: 1, vx: 0, vy: 0, vz: 0, vis: true, roll: false, spin: 'flat' });
  say(srv === 0 ? (sc.faults ? '二发 · 滑动发球' : '你发球 · 等球抛起来时滑动') : (sc.faults ? 'AI 二发' : 'AI 发球'));
  ui();
}
function updateToss() {
  const t = now - toss.t0, server = toss.server === 0 ? P : A;
  ball.x = server.x + .35 * sideSign(toss.server); ball.y = server.y;
  ball.z = t < 0 ? 1 : Math.max(1, 1 + 6.26 * t - 4.9 * t * t);
  if (toss.server === 1 && t >= TOSS_IDEAL + toss.jit) serve(1, 0, null);

// ================= 规则判定 =================

// ================= 跑位 =================

// ================= 主循环 =================

    ac = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { ac = null }
}
function snd(type) {
  if (!ac || S.mute) return;
  const t = ac.currentTime, out = ac.destination;
  const noise = (dur, freq, vol, q = 1.5) => {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t + dur);
  };
  const tone = (f0, f1, dur, vol, type = 'sine', delay = 0) => {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = type;
    o.frequency.setValueAtTime(f0, t + delay); o.frequency.exponentialRampToValueAtTime(f1, t + delay + dur);
    g.gain.setValueAtTime(vol, t + delay); g.gain.exponentialRampToValueAtTime(.001, t + delay + dur);
    o.connect(g); g.connect(out); o.start(t + delay); o.stop(t + delay + dur);
  };
  if (type === 'hit') { noise(.06, 2400, .5); tone(260, 120, .07, .35) }
  else if (type === 'bounce') noise(.05, 900, .25);
  else if (type === 'win') { tone(660, 660, .12, .15, 'triangle'); tone(880, 880, .18, .15, 'triangle', .1) }
  else if (type === 'lose') tone(330, 200, .25, .15, 'triangle');
  else if (type === 'cheer') noise(1.2, 1400, .18, .5);
}
function vibrate(ms) { try { navigator.vibrate && navigator.vibrate(ms) } catch (e) {} }

// ================= 输入 =================
let touch = null;
function aimOf(dx, dy) { return clamp(Math.atan2(dx, -dy) / (Math.PI / 4), -1, 1) }
cv.addEventListener('pointerdown', e => { e.preventDefault(); touch = { x: e.clientX, y: e.clientY, id: e.pointerId, fired: false } });
cv.addEventListener('pointermove', e => {
  if (!touch || touch.fired || e.pointerId !== touch.id) return;
  const dx = e.clientX - touch.x, dy = e.clientY - touch.y;
  if (Math.hypot(dx, dy) > 26) { touch.fired = true; swing(aimOf(dx, dy)) }
});
const up = e => { if (!touch || e.pointerId !== touch.id) return; if (!touch.fired) swing(null); touch = null };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', () => touch = null);
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key;
  if (k === ' ' || k === 'ArrowUp' || k === 'w') swing(null);
  else if (k === 'ArrowLeft' || k === 'a') swing(-.8);
  else if (k === 'ArrowRight' || k === 'd') swing(.8);
  else if (k >= '1' && k <= '5') pickShot(['topspin', 'flat', 'slice', 'lob', 'drop'][k - 1]);
  else if (k === 'Escape' && mode !== 'menu') togglePause();
});

function pickShot(s) { shot = s; document.querySelectorAll('[data-s]').forEach(b => b.classList.toggle('on', b.dataset.s === s)) }
document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => pickShot(b.dataset.s));
document.querySelector('[data-net]').onclick = e => { netMode = !netMode; e.currentTarget.classList.toggle('on', netMode); say(netMode ? '🏃 上网截击：下一拍后冲到网前' : '回到底线') };
document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
  if (mode === 'menu') return;
  if (P.ep < 100) { say('⚡ 能量不足（击球攒能量）'); return }
  const k = b.dataset.k; P.ep = 0;
  if (k === 'fire') { fire = true; say('🔥 爆发：下一拍更快更准') }
  if (k === 'slow') { slowT = 5; say('❄️ AI 减速 5 秒') }
  if (k === 'zone') { zoneN = 3; say('🎯 Zone：3 拍内判定更宽、够得更远') }
  ui();
});
function segment(row, attr, val) { document.querySelectorAll(`#${row} button`).forEach(b => b.classList.toggle('on', b.dataset[attr] === String(val))) }
document.querySelectorAll('[data-lv]').forEach(b => b.onclick = () => { S.level = b.dataset.lv; segment('lvRow', 'lv', S.level); save() });
document.querySelectorAll('[data-len]').forEach(b => b.onclick = () => { S.setLen = +b.dataset.len; segment('lenRow', 'len', S.setLen); save() });
function setMute() { $('mute').textContent = S.mute ? '🔇' : '🔊' }
$('mute').onclick = () => { S.mute = !S.mute; save(); setMute(); if (!S.mute) audioInit() };
function togglePause() { if (mode === 'menu' || !$('over').classList.contains('hide')) return; paused = !paused; $('pause').classList.toggle('hide', !paused) }
$('pauseBtn').onclick = togglePause; $('resume').onclick = togglePause;
$('quit').onclick = () => { paused = false; $('pause').classList.add('hide'); toMenu() };
$('again').onclick = () => { $('over').classList.add('hide'); begin(mode) };
$('back').onclick = () => { $('over').classList.add('hide'); toMenu() };
$('start').onclick = () => begin('match');
$('train').onclick = () => begin('train');
document.addEventListener('visibilitychange', () => { if (document.hidden && mode !== 'menu' && !paused) togglePause() });

function begin(m) {
  audioInit();
  mode = m; paused = false; now = 0; acc = 0;
  sc = { pts: [0, 0], games: [0, 0], tb: false, server: 1, faults: 0, setLen: S.setLen };
  st = { winners: 0, errors: 0, aces: 0, df: 0, perfect: 0, hits: 0, maxRally: 0 };
  combo = 0; rallyHits = 0; fire = false; slowT = 0; zoneN = 0; fx = []; marks = [];
  P.ep = 0; P.st = 100; P.x = 0; P.y = HL + .9; A.x = 0; A.y = -HL - .9;
  $('menu').classList.add('hide');
  phase = 'dead'; deadT = now + .4; nextFn = startPoint; ball.vis = false;
  ui();
}
function toMenu() {
  mode = 'menu'; phase = 'idle'; ball.vis = false; sc = null; ui(); say('');
  $('rec').textContent = `战绩 ${S.wins} 胜 ${S.losses} 负 · 最长连击 ${S.bestCombo} · 训练最佳 ${S.bestRally} 拍`;
  $('menu').classList.remove('hide');
}

addEventListener('resize', layout);
layout(); segment('lvRow', 'lv', S.level); segment('lenRow', 'len', S.setLen); setMute(); toMenu();
requestAnimationFrame(frame);
</script>
