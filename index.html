<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1430">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Tennis Smash 2026</title>
<style>
/* 布局：全屏 3D 画布在底层，2D 覆盖层画飘字与滑动轨迹，最上层是 DOM 界面 */
:root{
  --ink:#0a1330; --panel:#13204a; --panel2:#1c2d66; --edge:#0a1128; --line:rgba(255,255,255,.12);
  --text:#f3f6ff; --mute:#9fb0d9; --ball:#d7f94a; --ball-deep:#86a312; --blue:#2f7dff; --red:#ff5a4f; --gold:#ffc84a;
  --display:"Arial Black","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--body);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#gl,#ov{position:fixed;inset:0;width:100%;height:100%;display:block}
#ov{z-index:1}
.hidden{display:none!important}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
button:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
svg{display:block}

/* ---------- 通用按钮（立体按压感）---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:16px;background:var(--panel2);box-shadow:0 5px 0 var(--edge),inset 0 1px 0 rgba(255,255,255,.12);font-weight:800;font-size:16px;letter-spacing:.5px;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge),inset 0 1px 0 rgba(255,255,255,.12)}
.btn.primary{background:linear-gradient(180deg,#ecff7a,#c6e433);color:#1a2406;box-shadow:0 5px 0 var(--ball-deep),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.primary:active{box-shadow:0 1px 0 var(--ball-deep)}
.btn.blue{background:linear-gradient(180deg,#4b92ff,#2a68e0);box-shadow:0 5px 0 #173f8f,inset 0 1px 0 rgba(255,255,255,.3)}
.btn[disabled]{opacity:.45;pointer-events:none}
.round{width:44px;height:44px;border-radius:50%;background:rgba(10,19,48,.72);display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.round svg{width:22px;height:22px}

/* ---------- 屏幕容器 ---------- */
.screen{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.screen.solid{background:radial-gradient(120% 80% at 50% 0%,#1d3170 0%,var(--ink) 60%)}
.screen.dim{background:rgba(5,10,28,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.head h2{margin:0;font-family:var(--display);font-size:22px;font-style:italic;letter-spacing:.5px}
.scroll{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:12px;padding-bottom:8px;touch-action:pan-y}
.pill{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 6px;border-radius:17px;background:rgba(10,19,48,.75);font-weight:900;font-variant-numeric:tabular-nums}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc84a 45%,#c98a12);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);display:inline-block}
.cup{width:22px;height:22px;color:var(--gold)}

/* ---------- 首页 ---------- */
#home{background:linear-gradient(180deg,rgba(6,12,32,.85) 0%,rgba(6,12,32,0) 26%,rgba(6,12,32,0) 52%,rgba(6,12,32,.92) 78%)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.profile{display:flex;align-items:center;gap:10px}
.avatar{width:44px;height:44px;border-radius:12px;border:3px solid #fff;display:grid;place-items:center;font-weight:900;font-size:18px}
.pname{font-weight:900;font-size:15px}.plv{font-size:12px;color:var(--mute)}
.pills{display:flex;gap:8px}
.logo{margin-top:18px;text-align:left;line-height:.86;font-family:var(--display);font-style:italic;transform:skewX(-6deg)}
.logo .l1{display:block;font-size:44px;letter-spacing:1px;color:#fff;text-shadow:0 4px 0 #0a1330}
.logo .l2{display:block;font-size:56px;color:var(--ball);text-shadow:0 5px 0 #405010}
.logo .l3{display:inline-block;margin-top:6px;font-size:15px;padding:4px 10px;border-radius:6px;background:var(--blue);letter-spacing:3px}
.home-actions{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.big{min-height:74px;flex-direction:column;gap:2px;font-family:var(--display);font-style:italic;font-size:24px}
.big small{font-family:var(--body);font-style:normal;font-size:13px;font-weight:700;opacity:.75}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.row3 .btn{flex-direction:column;gap:2px;min-height:64px;font-size:13px}
.row3 svg{width:24px;height:24px}

/* ---------- 巡回赛 ---------- */
.arena{position:relative;border-radius:20px;padding:16px;overflow:hidden;box-shadow:0 5px 0 var(--edge);min-height:132px;display:flex;flex-direction:column;gap:8px}
.arena::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;border:16px solid rgba(255,255,255,.12)}
.arena h3{margin:0;font-family:var(--display);font-style:italic;font-size:21px;position:relative;z-index:1}
.arena .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:800;position:relative;z-index:1}
.tag{padding:3px 8px;border-radius:8px;background:rgba(0,0,0,.28)}
.rounds{display:flex;gap:6px;align-items:center;position:relative;z-index:1}
.rd{flex:1;height:30px;border-radius:9px;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;gap:4px}
.rd.done{background:var(--ball);color:#1a2406}.rd.next{background:#fff;color:#0a1330}
.arena .go{position:relative;z-index:1;margin-top:4px}
.locked{filter:grayscale(.75) brightness(.7)}
.lockmsg{position:relative;z-index:1;display:flex;align-items:center;gap:8px;font-weight:900;font-size:14px;height:30px}
[hidden]{display:none!important}

/* ---------- 列表卡片（装备 / 设置）---------- */
.card{background:var(--panel);border-radius:18px;padding:14px;box-shadow:0 4px 0 var(--edge)}
.stat{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.stat h4{margin:0;font-size:16px;font-weight:900}.stat .g{font-size:12px;color:var(--mute)}
.lvbar{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.lvbar i{height:8px;border-radius:3px;background:rgba(255,255,255,.12)}.lvbar i.on{background:var(--ball)}
.stat .eff{grid-column:1/-1;font-size:13px;color:var(--mute)}
.up{min-height:44px;padding:0 14px;font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--panel);padding:5px;border-radius:14px;margin-bottom:12px}
.tabs button{height:40px;border-radius:10px;font-weight:900}.tabs button.on{background:var(--panel2)}
.outfits{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.outfit{border-radius:16px;padding:10px 6px;background:var(--panel);box-shadow:0 4px 0 var(--edge);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:800}
.outfit.on{outline:3px solid var(--ball)}
.sw{width:54px;height:54px;border-radius:14px;position:relative;overflow:hidden}
.sw i{position:absolute;left:0;right:0;bottom:0;height:34%}
.outfit .price{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--mute)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;font-weight:800}
.sw-t{width:54px;height:32px;border-radius:16px;background:rgba(255,255,255,.18);position:relative;transition:background .15s;flex:none}
.sw-t::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
.sw-t.on{background:var(--ball)}.sw-t.on::after{left:25px}
.seg{display:grid;gap:6px;background:var(--panel);padding:5px;border-radius:14px}
.seg button{min-height:44px;border-radius:10px;font-weight:900;font-size:14px;padding:0 4px}.seg button.on{background:var(--ball);color:#1a2406}
.label{font-size:12px;color:var(--mute);font-weight:800;letter-spacing:1px;margin:4px 2px -4px}

/* ---------- 对阵 VS ---------- */
.vs{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
.vs .round-name{text-align:center;font-weight:900;color:var(--ball);letter-spacing:2px}
.vs h2{text-align:center;margin:0;font-family:var(--display);font-style:italic;font-size:26px}
.duel{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.fighter{border-radius:20px;padding:16px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.fighter .avatar{width:64px;height:64px;font-size:26px;border-radius:18px}
.fighter .nm{font-weight:900;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.fighter .st{font-size:12px;color:rgba(255,255,255,.85)}
.stars{display:flex;gap:2px;color:var(--gold)}.stars svg{width:14px;height:14px}
.vsx{font-family:var(--display);font-style:italic;font-size:34px;color:var(--ball);text-shadow:0 4px 0 #405010}

/* ---------- 比赛 HUD ---------- */
#hud{position:fixed;inset:0;z-index:3;pointer-events:none}
#hud button{pointer-events:auto}
.sb{position:absolute;left:max(10px,env(safe-area-inset-left));top:calc(8px + env(safe-area-inset-top));border-radius:12px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.35);font-variant-numeric:tabular-nums;min-width:178px}
.sbr{display:grid;grid-template-columns:14px 1fr 28px 40px;align-items:center;height:28px;background:rgba(10,19,48,.9);font-weight:900;font-size:14px}
.sbr+.sbr{border-top:1px solid rgba(255,255,255,.08)}
.sbr .srv{width:8px;height:8px;border-radius:50%;margin-left:5px;background:transparent}
.sbr .srv.on{background:var(--ball);box-shadow:0 0 6px var(--ball)}
.sbr .nm{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-right:6px}
.sbr .gm{text-align:center;background:rgba(255,255,255,.08);height:100%;display:grid;place-items:center}
.sbr .pt{text-align:center;background:var(--ball);color:#1a2406;height:100%;display:grid;place-items:center}
.sbtag{background:var(--blue);font-size:11px;font-weight:800;padding:3px 8px;letter-spacing:.5px}
.meters{position:absolute;left:max(10px,env(safe-area-inset-left));top:calc(100px + env(safe-area-inset-top));width:178px;display:flex;flex-direction:column;gap:4px}
.meter{height:6px;border-radius:3px;background:rgba(10,19,48,.7);overflow:hidden}
.meter i{display:block;height:100%;width:100%;transform-origin:left;transition:transform .2s}
#stM i{background:#7fc4ff}
#pauseBtn{position:absolute;right:max(10px,env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top))}
#say{position:absolute;left:50%;transform:translateX(-50%);top:calc(150px + env(safe-area-inset-top));padding:6px 14px;border-radius:14px;background:rgba(10,19,48,.7);font-weight:800;font-size:14px;white-space:nowrap;transition:opacity .3s}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--display);font-style:italic;font-size:30px;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.45);opacity:0;transform:scale(.8);transition:opacity .2s,transform .2s}
#banner.show{opacity:1;transform:scale(1)}
.skills{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:calc(84px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.sk{width:58px;height:58px;border-radius:50%;position:relative;display:grid;place-items:center;background:conic-gradient(var(--ball) calc(var(--e,0)*1%),rgba(10,19,48,.75) 0)}
.sk::before{content:"";position:absolute;inset:4px;border-radius:50%;background:#14214d}
.sk span{position:relative;font-size:12px;font-weight:900;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.sk span b{font-size:20px}
.sk.ready{animation:pulse 1s infinite}
.sk.ready::before{background:linear-gradient(180deg,#2a3f86,#14214d)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(215,249,74,.35)}}
.shots{position:absolute;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.chip{height:52px;border-radius:14px;background:rgba(10,19,48,.82);font-weight:900;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.chip svg{width:18px;height:18px}
.chip.on{background:#fff;color:#0a1330}
.chip.net.on{background:var(--gold);color:#2a1a00}
@media (orientation:landscape){
  .shots{left:auto;width:220px;grid-template-columns:repeat(3,1fr)}
  .skills{right:auto;left:max(10px,env(safe-area-inset-left));bottom:calc(10px + env(safe-area-inset-bottom));flex-direction:row}
  .meters{top:calc(100px + env(safe-area-inset-top))}
  #say{top:calc(10px + env(safe-area-inset-top))}
  .screen .home-actions{max-width:420px;margin-left:auto;margin-right:0}
  #home .logo{position:absolute;left:max(24px,env(safe-area-inset-left));bottom:calc(24px + env(safe-area-inset-bottom))}
  #home{background:linear-gradient(90deg,rgba(6,12,32,.8) 0%,rgba(6,12,32,0) 40%,rgba(6,12,32,0) 55%,rgba(6,12,32,.9) 85%)}
}

/* ---------- 弹窗 ---------- */
.modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(3,7,20,.75);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal .box{width:min(100%,420px);max-height:92vh;overflow:auto;background:var(--panel);border-radius:24px;padding:22px 18px;box-shadow:0 8px 0 var(--edge);display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0;text-align:center;font-family:var(--display);font-style:italic;font-size:26px}
.modal p{margin:0;color:var(--mute);line-height:1.6;font-size:14px;text-align:center}
.res-title{font-family:var(--display);font-style:italic;font-size:42px;text-align:center;line-height:1}
.res-title.win{color:var(--ball);text-shadow:0 5px 0 #405010}.res-title.lose{color:#fff;text-shadow:0 5px 0 #000}
.res-score{text-align:center;font-weight:900;font-size:18px;font-variant-numeric:tabular-nums}
.grid-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gs{background:var(--panel2);border-radius:12px;padding:8px 4px;text-align:center}
.gs b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.gs span{font-size:11px;color:var(--mute)}
.reward{display:flex;align-items:center;justify-content:center;gap:10px;font-size:28px;font-weight:900;font-variant-numeric:tabular-nums}
.reward .coin{width:30px;height:30px}
.tut{display:flex;flex-direction:column;gap:12px}
.tut-row{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;font-size:14px;line-height:1.5}
.tut-ic{width:48px;height:48px;border-radius:14px;background:var(--panel2);display:grid;place-items:center}
.tut-ic svg{width:28px;height:28px}
/* ---------- 立绘 ---------- */
.pt{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.pt.flip{transform:scaleX(-1)}
.avatar{overflow:hidden;padding:0}
.avatar .pt{transform:translateY(8%) scale(1.15)}
.sbr .nm{display:flex;align-items:center;gap:4px}
.sbr .av{width:22px;height:22px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.12);flex:none}
.sbr .av .pt{transform:translateY(10%) scale(1.25)}
.fighter .pt.big{width:120px;height:120px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
.row3.four{grid-template-columns:repeat(4,1fr)}
/* 球员卡 */
.char{display:grid;grid-template-columns:116px 1fr;gap:12px;align-items:center;padding:12px;border-radius:20px;background:linear-gradient(120deg,color-mix(in srgb,var(--c) 55%,#13204a),#13204a 70%);box-shadow:0 5px 0 var(--edge)}
.char.on{outline:3px solid var(--ball)}
.char-art{width:116px;height:116px;border-radius:16px;background:radial-gradient(circle at 50% 70%,rgba(255,255,255,.25),transparent 70%)}
.char-info{display:flex;flex-direction:column;gap:6px;min-width:0}
.char-name{font-family:var(--display);font-style:italic;font-size:20px}.char-name small{font-family:var(--body);font-style:normal;font-size:12px;color:var(--mute);font-weight:800}
.char .meta{display:flex;flex-wrap:wrap;gap:4px;font-size:11px;font-weight:800}
.tag.buff{background:rgba(95,224,122,.25)}.tag.nerf{background:rgba(255,90,79,.25)}
.ult-line{font-size:12px;line-height:1.5;color:rgba(255,255,255,.85)}.ult-line b{display:block;color:var(--gold);font-size:13px}
.char .up{align-self:flex-start;min-height:40px}
/* 必杀技按钮 */
.sk small{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;background:#14214d;border-radius:6px;padding:0 4px}
.sk.ult{width:72px;height:72px;overflow:visible}
.sk.ult::before{inset:4px}
.sk.ult .pt{position:absolute;inset:6px;width:auto;height:auto;border-radius:50%;overflow:hidden;clip-path:circle(50%)}
.sk.ult em{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-size:10px;font-weight:900;background:var(--gold);color:#2a1a00;border-radius:6px;padding:1px 5px}
/* 入场 / 必杀 / 回放 / 结算 */
.fx-layer{position:fixed;inset:0;z-index:8;pointer-events:none}
.intro{pointer-events:auto;display:flex;flex-direction:column;justify-content:space-between;padding:calc(30px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(5,10,28,.7),transparent 30%,transparent 65%,rgba(5,10,28,.8))}
.intro-top{text-align:center;font-family:var(--display);font-style:italic;font-size:20px;color:var(--ball);letter-spacing:1px;animation:fadeIn .6s both}
.intro-duel{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:6px}
.ib{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:18px;font-weight:900;animation:slideL .6s .2s both}
.ib.right{animation-name:slideR}
.ib .pt.big{width:min(36vw,170px);height:min(36vw,170px);border-radius:24px;background:radial-gradient(circle at 50% 75%,var(--c),transparent 70%)}
.intro-vs{font-family:var(--display);font-style:italic;font-size:46px;color:var(--ball);text-shadow:0 5px 0 #405010;align-self:center;animation:pop .5s .5s both}
.intro-skip{position:absolute;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));font-size:12px;color:var(--mute)}
.cutin{display:flex;align-items:center;background:rgba(0,0,0,.25)}
.cutin .band{position:relative;width:100%;height:150px;background:linear-gradient(100deg,transparent 0 6%,#ffc84a 6% 8%,#13204a 8% 92%,#ffc84a 92% 94%,transparent 94%);display:flex;align-items:center;gap:14px;padding:0 10%;animation:band 1.1s both}
.cutin.foe .band{flex-direction:row-reverse;background:linear-gradient(100deg,transparent 0 6%,#ff5a4f 6% 8%,#2a0e18 8% 92%,#ff5a4f 92% 94%,transparent 94%)}
.cutin .pt.big{width:150px;height:150px;flex:none;animation:slideL .35s both}
.cutin.foe .pt.big{animation-name:slideR}
.cut-name{font-family:var(--display);font-style:italic;font-size:32px;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.4);line-height:1.1}
.cut-name small{display:block;font-family:var(--body);font-style:normal;font-size:13px;color:var(--gold)}
.replay .lb{position:absolute;left:0;right:0;height:9vh;background:#000;animation:fadeIn .3s both}.replay .top{top:0}.replay .bot{bottom:0}
.replay{pointer-events:auto}
.rp-tag{position:absolute;left:16px;top:calc(9vh + 10px);padding:4px 10px;border-radius:6px;background:var(--red);font-weight:900;font-style:italic;letter-spacing:2px;animation:blink 1s infinite}
.res-hero{display:flex;justify-content:center;margin:-6px 0 -4px}.res-hero .pt.big{width:110px;height:110px}
/* 横屏矮屏：对阵页等内容压缩，超出时可滚动 */
.screen{overflow-y:auto}
@media (orientation:landscape) and (max-height:520px){
  .vs{gap:8px;flex:1 0 auto}
  .fighter{flex-direction:row;padding:8px 12px;gap:10px;text-align:left}
  .fighter .pt.big{width:72px;height:72px}
  .fighter .nm{font-size:16px}
  .vs .big,.screen > .big{min-height:54px}
  .head{margin-bottom:6px}
  .char{grid-template-columns:90px 1fr}.char-art{width:90px;height:90px}
  .intro .ib .pt.big{width:120px;height:120px}
}
@keyframes slideL{from{transform:translateX(-60vw)}}
@keyframes slideR{from{transform:translateX(60vw)}}
@keyframes pop{from{transform:scale(0)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes blink{50%{opacity:.4}}
@keyframes band{0%{transform:scaleY(0)}12%{transform:scaleY(1)}88%{transform:scaleY(1);opacity:1}100%{transform:scaleY(0);opacity:0}}
#err{position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#5a1010;color:#fff;font:12px/1.4 monospace;padding:8px;border-radius:8px;white-space:pre-wrap;max-height:40vh;overflow:auto}
@media (prefers-reduced-motion:reduce){.sk.ready{animation:none}#banner{transition:none}}
</style>
